<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ваш подарок · Epilate Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a2c71;
    --navy-deep:#071f52;
    --navy-soft:#eaeef6;
    --ink:#000000;
    --white:#ffffff;
    --line:#dfe4ef;
    --grey:#7a8398;
    --tg:#2aabee;
    --vk:#0077ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Montserrat',sans-serif;
    background:var(--white);
    color:var(--ink);
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:24px 18px;
    -webkit-font-smoothing:antialiased;
    position:relative;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;
    top:-28%;left:50%;
    width:120vw;max-width:720px;height:56vh;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(10,44,113,.10), transparent 70%);
    pointer-events:none;
  }
  .card{
    width:100%;max-width:440px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:26px;
    padding:38px 30px 30px;
    box-shadow:0 24px 60px -30px rgba(10,44,113,.35);
    position:relative;z-index:1;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .eyebrow{
    font-size:11px;letter-spacing:.32em;font-weight:700;
    color:var(--navy);text-transform:uppercase;text-align:center;margin-bottom:26px;
  }
  .gift{width:76px;height:76px;margin:0 auto 22px;display:block}
  .gift .lid,.gift .box{fill:var(--navy-soft);stroke:var(--navy);stroke-width:2.2}
  .gift .ribbon{stroke:var(--navy);stroke-width:2.6;fill:none;stroke-linecap:round}
  .gift .bow{fill:var(--navy)}
  .gift .sparkle{fill:var(--navy)}
  .sparkle{animation:tw 2.6s ease-in-out infinite}
  .sparkle.b{animation-delay:1.3s}
  @keyframes tw{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}

  h1{
    font-size:24px;line-height:1.28;font-weight:700;
    text-align:center;letter-spacing:-.015em;margin-bottom:12px;text-wrap:balance;
  }
  h1 .accent{color:var(--navy)}
  .sub{
    font-size:14.5px;line-height:1.6;font-weight:400;color:#4b5261;
    text-align:center;max-width:330px;margin:0 auto 24px;
  }

  .progress-wrap{margin:0 auto 30px;max-width:300px}
  .progress-label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--navy);margin-bottom:8px;
  }
  .progress-label .pct{font-size:12px}
  .track{height:8px;border-radius:20px;background:var(--navy-soft);overflow:hidden;position:relative}
  .fill{
    height:100%;width:90%;border-radius:20px;
    background:linear-gradient(90deg,var(--navy) 0%, var(--navy-deep) 100%);
    position:relative;transform-origin:left;
    animation:grow 1.1s .35s cubic-bezier(.3,.8,.3,1) both;
  }
  @keyframes grow{from{width:0}to{width:90%}}
  .fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent, rgba(255,255,255,.55), transparent);
    transform:translateX(-100%);animation:sheen 2.6s 1.3s ease-in-out infinite;
  }
  @keyframes sheen{0%{transform:translateX(-100%)}55%,100%{transform:translateX(220%)}}

  .choose{text-align:center;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink);margin-bottom:16px}

  .btn{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:15px 18px;border-radius:16px;
    border:1.5px solid var(--line);background:var(--white);color:var(--ink);
    font-family:inherit;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;
    transition:transform .18s ease, box-shadow .25s ease, border-color .25s ease;
    margin-bottom:12px;
  }
  .btn:last-of-type{margin-bottom:0}
  .btn:hover{transform:translateY(-2px);border-color:var(--navy);box-shadow:0 14px 26px -16px rgba(10,44,113,.5)}
  .btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
  .btn:active{transform:translateY(0)}
  .btn .ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center}
  .btn.tg .ic{background:rgba(42,171,238,.12)}
  .btn.vk .ic{background:rgba(0,119,255,.10)}
  .btn .ic svg{width:22px;height:22px;display:block}
  .btn .txt{display:flex;flex-direction:column;justify-content:center;line-height:1.3;text-align:left}
  .btn .txt small{font-size:11.5px;font-weight:400;color:var(--grey)}
  .btn .arrow{margin-left:auto;color:var(--navy);font-size:18px;transition:transform .2s ease}
  .btn:hover .arrow{transform:translateX(4px)}

  .note{margin-top:22px;text-align:center;font-size:11.5px;line-height:1.6;color:var(--grey)}
  .note strong{color:var(--navy);font-weight:600}

  .footer{
    margin-top:20px;padding-top:18px;border-top:1px solid var(--line);
    text-align:center;font-size:10px;letter-spacing:.28em;font-weight:700;
    color:var(--navy);text-transform:uppercase;
  }

  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}.fill{width:90%}}
  @media(max-width:380px){.card{padding:32px 22px 26px}h1{font-size:22px}}
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Epilate Me</div>

    <svg class="gift" viewBox="0 0 76 76" aria-hidden="true">
      <path class="sparkle" d="M14 12 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z"/>
      <path class="sparkle b" d="M62 20 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2 z"/>
      <rect class="box" x="18" y="36" width="40" height="28" rx="4"/>
      <rect class="lid" x="14" y="28" width="48" height="12" rx="4"/>
      <path class="ribbon" d="M38 28 V64"/>
      <path class="bow" d="M38 28 c-6 -10 -18 -8 -16 0 c1.5 4 10 3 16 0 z"/>
      <path class="bow" d="M38 28 c6 -10 18 -8 16 0 c-1.5 4 -10 3 -16 0 z"/>
      <circle class="bow" cx="38" cy="28" r="3"/>
    </svg>

    <h1>Ваш подарок <span class="accent">почти у вас</span></h1>
    <p class="sub">Скидка 20% на лазерную эпиляцию, которая гарантированно избавит вас от нежелательных волос. Осталось два шага.</p>

    <div class="progress-wrap">
      <div class="progress-label"><span>Осталось совсем немного</span><span class="pct">90%</span></div>
      <div class="track"><div class="fill"></div></div>
    </div>

    <p class="choose">Выберите удобный способ получения 🎁</p>

    <!-- =============================================================== -->
    <!--  ВСТАВЬТЕ ССЫЛКУ НА TELEGRAM-БОТА ниже, между кавычками href="" -->
    <!-- =============================================================== -->
    <a class="btn tg" href="https://t.me/EpilateMe_BalanceMe_bot?start=c1787235418432-ds" aria-label="Получить подарок в Telegram">
      <span class="ic">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21.9 4.3 18.6 20c-.25 1.1-.9 1.37-1.83.85l-5.06-3.73-2.44 2.35c-.27.27-.5.5-1.02.5l.36-5.16L16.86 6.6c.4-.36-.09-.56-.63-.2L6.9 12.2 1.9 10.63c-1.08-.34-1.1-1.08.23-1.6L20.5 2.7c.9-.34 1.7.2 1.4 1.6Z" fill="#2aabee"/></svg>
      </span>
      <span class="txt">Получить в Telegram</span>
      <span class="arrow">&rarr;</span>
    </a>

    <!-- =============================================================== -->
    <!--  ВСТАВЬТЕ ССЫЛКУ НА ВК ниже, между кавычками href=""            -->
    <!-- =============================================================== -->
    <a class="btn vk" href="https://vk.ru/app5898182_-211188131#s=3838135" aria-label="Получить подарок во ВКонтакте">
      <span class="ic">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13.1 17.2c-5.24 0-8.4-3.63-8.53-9.66h2.66c.09 4.43 2.08 6.3 3.63 6.69V7.54h2.52v3.84c1.51-.16 3.1-1.9 3.63-3.84h2.5c-.4 2.38-2.11 4.12-3.32 4.84 1.21.58 3.16 2.1 3.9 4.82h-2.76c-.58-1.8-2.02-3.19-3.95-3.38v3.38H13.1Z" fill="#0077ff"/></svg>
      </span>
      <span class="txt">Получить во ВКонтакте</span>
      <span class="arrow">&rarr;</span>
    </a>

    <div class="footer">международная сеть клиник</div>
  </main>
</body>
</html>
